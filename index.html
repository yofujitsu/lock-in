<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lock the f..k in</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Fira+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved style before first render to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('lockin-style');
          var s = raw ? JSON.parse(raw) : null;
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var palette = s && s.palette ? s.palette : 'dusk';
          var theme = s && (s.theme === 'light' || s.theme === 'dark') ? s.theme : dark ? 'dark' : 'light';
          var err = s && (s.err === 'strong' || s.err === 'soft' || s.err === 'line') ? s.err : 'strong';
          var ui = {
            Onest: "'Onest', system-ui, sans-serif",
            Manrope: "'Manrope', system-ui, sans-serif",
            Nunito: "'Nunito', system-ui, sans-serif",
            'Golos Text': "'Golos Text', system-ui, sans-serif",
            Inter: "'Inter', system-ui, sans-serif"
          };
          var text = {
            'IBM Plex Mono': "'IBM Plex Mono', ui-monospace, monospace",
            'JetBrains Mono': "'JetBrains Mono', ui-monospace, monospace",
            'Fira Mono': "'Fira Mono', ui-monospace, monospace",
            'Roboto Mono': "'Roboto Mono', ui-monospace, monospace"
          };
          var root = document.documentElement;
          root.dataset.palette = palette;
          root.dataset.theme = theme;
          root.dataset.err = err;
          if (s && s.uiFont && ui[s.uiFont]) root.style.setProperty('--font-ui', ui[s.uiFont]);
          if (s && s.textFont && text[s.textFont]) root.style.setProperty('--font-text', text[s.textFont]);
          if (s && typeof s.size === 'number') root.style.setProperty('--text-size', s.size + 'px');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
